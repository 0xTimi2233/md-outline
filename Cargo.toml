[package]
name = "md-outline"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["sony"]
description = "A fast, AST-based Markdown outline CLI that extracts clean hierarchical heading trees with exact line numbers."
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xTimi2233/md-outline"
keywords = ["markdown", "outline", "toc", "cli", "tree"]
categories = ["command-line-utilities", "text-processing"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
anyhow = "1.0.97"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.17.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
