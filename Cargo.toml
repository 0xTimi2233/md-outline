[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
authors = ["0xTimi2233"]
license = "MIT"
repository = "https://github.com/0xTimi2233/md-outline"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "md-outline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "A fast, AST-based Markdown outline CLI that extracts clean hierarchical heading trees with exact line numbers."
keywords = ["markdown", "outline", "toc", "cli", "tree"]
categories = ["command-line-utilities", "text-processing"]

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
pulldown-cmark = { version = "0.13.0", default-features = false }
anyhow = "1.0.97"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
tempfile = "3.17.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"

[workspace.metadata.dist]
allow-dirty = ["ci"]

cargo-dist-version = "0.32.0"
ci = "github"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
installers = ["shell", "powershell"]

[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-latest"
x86_64-unknown-linux-gnu = "ubuntu-latest"
aarch64-unknown-linux-gnu = "ubuntu-latest"
x86_64-apple-darwin = "macos-latest"
aarch64-apple-darwin = "macos-latest"
x86_64-pc-windows-msvc = "windows-latest"
