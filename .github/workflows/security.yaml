name: Security

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gitleaks:
    name: 密钥泄露扫描
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 安装 Gitleaks CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*_linux_x64.tar.gz' --output - | sudo tar -xz -C /usr/local/bin gitleaks
      - name: 执行密钥扫描
        run: gitleaks git --verbose --redact .

  cargo-deny:
    name: 依赖检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-deny
      - name: 检查依赖合规与安全漏洞
        run: cargo deny check advisories bans sources

  codeql:
    name: CodeQL 分析
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1739f9933caea2a8c3d8205fbc35850e05ee71ee # v4.38.0
        with:
          languages: rust
          build-mode: none
          queries: ${{ (github.event_name == 'schedule' || github.ref == 'refs/heads/main') && 'security-extended' || '' }}
      - uses: github/codeql-action/analyze@1739f9933caea2a8c3d8205fbc35850e05ee71ee # v4.38.0
        with:
          category: "/language:rust"
