name: CI

# 测试与安全门禁的编排者：并行调用 checks.yaml（测试/构建）与 security.yaml（安全），
# CI run 完成即代表全部门禁通过，Gate 合并门禁汇总校验。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * 0" # UTC 周日 23:30 ≈ 北京周一 07:30

permissions:
  contents: read

# 同一 PR 连续 push 时只保留最新一次运行（以 SHA 标识分组，杜绝乱序事件取消新 run）
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  checks:
    name: 检查与测试
    uses: ./.github/workflows/checks.yaml

  security:
    name: 安全审计
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yaml

  gate:
    name: 合并门禁
    needs: [checks, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 校验上游检查结果
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          echo "检查与测试：$CHECKS_RESULT"
          echo "安全审计：$SECURITY_RESULT"
          if [ "$CHECKS_RESULT" != "success" ] || [ "$SECURITY_RESULT" != "success" ]; then
            echo "上游检查未全部通过，阻断合并"
            exit 1
          fi
